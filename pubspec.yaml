name: medianest
description: "MediaNest — Capture, organize, translate, and reuse your content, all in one place."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.5
  provider: ^6.1.5
  path_provider: ^2.0.15
  path: ^1.8.3
  shared_preferences: ^2.1.2
  flutter_secure_storage: ^9.2.4
  video_player: ^2.10.0
  video_thumbnail: ^0.5.6
  permission_handler: ^12.0.0
  device_info_plus: ^11.5.0
  local_auth: ^2.3.0
  flutter_local_notifications: ^19.3.0
  http: ^1.3.0
  dio: ^5.2.0
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.10.1
  url_launcher: ^6.1.11
  share_plus: ^7.0.2
  firebase_core: ^3.14.0
  firebase_auth: ^5.7.0
  in_app_purchase: ^3.2.4
  
  collection: ^1.17.0
  image_picker: ^1.2.1
  firebase_storage: ^12.4.10
  cloud_firestore: ^5.6.12
  speech_to_text: ^7.4.0
  image: ^4.9.2
  file_picker: ^11.0.3
  # ffmpeg_kit_flutter_new: ^4.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"
  min_sdk_android: 21